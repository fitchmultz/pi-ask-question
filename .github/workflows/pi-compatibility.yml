name: Pi compatibility

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      official-version:
        description: Official stable version resolved for this run; blank resolves latest
        type: string
        default: ""
      fork-ref:
        description: Maintained fork commit resolved for this run; blank resolves main
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: pi-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality / strict checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
      - name: Use the reviewed npm version
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check formatting
        run: npm run format:check
      - name: Lint sources
        run: npm run lint
      - name: Run behavior tests
        if: ${{ !cancelled() }}
        run: npm test
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

  compatibility:
    uses: fitchmultz/.github/.github/workflows/pi-compatibility.yml@788061a362a34e0912b7c464d0ff0d854edb1805 # main
    with:
      automation-ref: 788061a362a34e0912b7c464d0ff0d854edb1805 # main
      official-version: ${{ inputs.official-version }}
      fork-ref: ${{ inputs.fork-ref }}
