name: Pi compatibility

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      official-version:
        description: Official stable version resolved for this run; blank resolves latest
        type: string
        default: ""
      fork-ref:
        description: Maintained fork commit resolved for this run; blank resolves main
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: pi-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PI_AUTOMATION_REF: 508d2e23c75cab8fdd28bc62fc7fed2a9a0d1cca # main

jobs:
  resolve:
    uses: fitchmultz/.github/.github/workflows/resolve-hosts.yml@508d2e23c75cab8fdd28bc62fc7fed2a9a0d1cca # main
    with:
      automation-ref: 508d2e23c75cab8fdd28bc62fc7fed2a9a0d1cca # main
      official-version: ${{ inputs.official-version }}
      fork-ref: ${{ inputs.fork-ref }}

  quality:
    name: quality / strict checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Use the reviewed npm version
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check formatting
        run: npm run format:check
      - name: Lint sources
        run: npm run lint
      - name: Run behavior tests
        if: ${{ !cancelled() }}
        run: npm test
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

  compatibility:
    needs: resolve
    if: ${{ !cancelled() }}
    name: compatibility / compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache
    steps:
      - name: Require resolved latest hosts
        env:
          RESOLVE: ${{ needs.resolve.result }}
        run: test "$RESOLVE" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ env.PI_AUTOMATION_REF }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Use the reviewed npm version
        run: npm install --global "$(node -p 'require("./automation/package.json").packageManager')"
      - name: Install native TUI prerequisites
        run: |
          bash automation/scripts/setup-linux-dns.sh
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y fd-find ripgrep
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: fork
        with:
          repository: fitchmultz/pi
          ref: ${{ needs.resolve.outputs.fork-ref }}
          path: fork
          persist-credentials: false
      - name: Build fork once
        working-directory: fork
        env:
          FORK_REF: ${{ needs.resolve.outputs.fork-ref }}
          PI_OFFLINE: "1"
          PI_TELEMETRY: "0"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run hydrate:model-data
          git diff --exit-code
          npm run build:offline
          node ../automation/scripts/pack-fork.mjs . "$RUNNER_TEMP/fork-package" "$FORK_REF"
          git diff --exit-code
      - name: Use the extension npm version
        run: npm install --global "$(node -p 'require("./extension/package.json").packageManager')"
      - name: Qualify official Pi
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICIAL_VERSION: ${{ needs.resolve.outputs.official-version }}
        run: |
          node automation/scripts/qualify.mjs --repo pi-ask-question --source "$GITHUB_WORKSPACE/extension" \
            --host official --target "$OFFICIAL_VERSION" --output "$RUNNER_TEMP/official-evidence"
      - name: Qualify fork Pi
        env:
          PI_COMPAT_FORK_REF: ${{ needs.resolve.outputs.fork-ref }}
        run: |
          node automation/scripts/qualify.mjs --repo pi-ask-question --source "$GITHUB_WORKSPACE/extension" \
            --host fork --target "$RUNNER_TEMP/fork-package" --output "$RUNNER_TEMP/fork-evidence"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-qualification
          path: |
            ${{ runner.temp }}/official-evidence
            ${{ runner.temp }}/fork-evidence
          if-no-files-found: error
          retention-days: 3
