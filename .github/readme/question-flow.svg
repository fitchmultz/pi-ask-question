<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">How pi-ask-question brings decisions to you</title>
  <desc id="desc">Pi asks for a decision, you choose or type an answer in the question UI, and Pi continues with your answer. A separate five-minute timeout returns an AFK reply and preserves saved answers.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#060A12"/>
      <stop offset="0.52" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#080C16"/>
    </linearGradient>
    <radialGradient id="blueBloom" cx="0.18" cy="0.18" r="0.8">
      <stop stop-color="#2563EB" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetBloom" cx="0.65" cy="0.40" r="0.7">
      <stop stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#172238" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0E1525" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172554" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#312E81" stop-opacity="0.58"/>
    </linearGradient>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#94A3B8" fill-opacity="0.11"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#02040A" flood-opacity="0.54"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#60A5FA"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#34D399"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#A78BFA"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      .step { font: 650 22px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 1px; }
      .heading { font: 700 38px Inter, ui-sans-serif, Arial, sans-serif; fill: #F8FAFC; }
      .copy { font: 450 27px Inter, ui-sans-serif, Arial, sans-serif; fill: #B9C7DD; }
      .connector { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Solid canvas and restrained depth use the fleet's dark SVG-native tokens. -->
  <rect width="1600" height="620" fill="url(#canvas)"/>
  <rect width="1600" height="620" fill="url(#blueBloom)"/>
  <rect width="1600" height="620" fill="url(#violetBloom)"/>
  <rect width="1600" height="620" fill="url(#dotGrid)"/>
  <g class="sans">
    <text x="64" y="94" font-size="50" font-weight="700" letter-spacing="-1" fill="#F8FAFC">A decision, then back to work</text>
    <text x="64" y="140" font-size="27" fill="#B9C7DD">ask_question brings the next choice to you in Pi's terminal or RPC dialogs.</text>
  </g>

  <!-- Normal answers and the alternative timeout use separate connector lanes. -->
  <path d="M400 320H476" class="connector" stroke="#60A5FA" marker-end="url(#arrowBlue)"/>
  <path d="M1040 320H1116" class="connector" stroke="#34D399" marker-end="url(#arrowGreen)"/>
  <path d="M760 428V481" class="connector" stroke="#A78BFA" stroke-dasharray="6 9" marker-end="url(#arrowViolet)"/>

  <!-- The question UI is the primary subject. -->
  <g filter="url(#shadow)" class="sans">
    <rect x="64" y="192" width="336" height="236" rx="24" fill="url(#glass)" stroke="#2A3851"/>
    <rect x="488" y="192" width="552" height="236" rx="28" fill="url(#focus)" stroke="#6D7DFF" stroke-opacity="0.62"/>
    <rect x="1128" y="192" width="408" height="236" rx="24" fill="url(#glass)" stroke="#285044"/>
    <rect x="488" y="494" width="1048" height="96" rx="24" fill="url(#glass)" stroke="#51426F"/>
  </g>
  <g class="sans">
    <text x="96" y="240" class="step" fill="#93C5FD">01 / PI AGENT</text>
    <text x="96" y="302" class="heading">Pi asks</text>
    <text x="96" y="351" class="copy">A decision needs</text>
    <text x="96" y="389" class="copy">your input.</text>

    <g transform="translate(520 214)">
      <rect width="264" height="38" rx="19" fill="#0C1425" stroke="#51426F"/>
      <text x="132" y="26" text-anchor="middle" class="step" fill="#D8B4FE">02 / QUESTION UI</text>
    </g>
    <text x="520" y="302" class="heading">Choose or type</text>
    <text x="520" y="351" class="copy">Single choice, multi-select,</text>
    <text x="520" y="389" class="copy">or your own answer.</text>

    <text x="1160" y="240" class="step" fill="#6EE7B7">03 / ANSWER</text>
    <text x="1160" y="302" class="heading">Pi continues</text>
    <text x="1160" y="351" class="copy">Your saved answer</text>
    <text x="1160" y="389" class="copy">returns to the agent.</text>

    <circle cx="530" cy="542" r="18" fill="#A78BFA" fill-opacity="0.16" stroke="#A78BFA"/>
    <path d="M530 530V542L538 547" fill="none" stroke="#D8B4FE" stroke-width="2.5" stroke-linecap="round"/>
    <text x="568" y="536" font-size="29" font-weight="650" fill="#F8FAFC">5 minutes without completion</text>
    <text x="568" y="570" font-size="25" fill="#B9C7DD">AFK reply; Pi can use its best judgment.</text>
    <text x="1504" y="550" text-anchor="end" font-size="26" fill="#D8B4FE">Saved answers kept</text>
  </g>
</svg>
